server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []  # Routes will be loaded dynamically from PostgreSQL
#      default-filters:
#        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/app
    username: postgres
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: ${DB_SHOW_SQL:true}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
# Circuit breaker configuration (disabled for now)
# resilience4j:
#   circuitbreaker:
#     instances:
#       log-producer-cb:
#         failure-rate-threshold: 50
#         wait-duration-in-open-state: 10s
#         sliding-window-size: 10
#         minimum-number-of-calls: 5

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Logging configuration
logging:
  level:
    com.distributedlog.system: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

